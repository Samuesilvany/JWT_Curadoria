    <div id="listagem">
        <h2>Itens de Curadoria</h2>
    </div>
    <script>
    async function api_listagem_itens() {
        const accessToken = localStorage.getItem('accessToken');
        const dados_usuario = document.getElementById('listagem');
        const requisicao = await fetch(
            'http://localhost:3001/itens/',
            {
                method: 'GET',
                headers: {
                    "Content-Type": "application/json",
                    "Authorization": `Bearer ${accessToken}`
                }
            }
        );

        const resposta = await requisicao.json();

        if (!requisicao.ok) {
            alert(resposta.message);
            throw new Error(`Erro ao enviar requisição: ${requisicao.status}`);
        }
    }
</script>
